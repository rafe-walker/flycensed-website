<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="200" fill="#06B6D4" opacity="0.05" />
  <circle cx="150" cy="530" r="150" fill="#06B6D4" opacity="0.05" />
  <!-- Accent bar -->
  <rect x="80" y="280" width="6" height="80" fill="url(#accent)" rx="3" />
  <!-- Logo text -->
  <text x="120" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="900" fill="#06B6D4">FLY</text>
  <text x="348" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="900" fill="#F1F5F9">CENSED</text>
  <!-- Tagline -->
  <text x="96" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#E2E8F0">Pass Your FAA Part 107 Exam With Confidence</text>
  <!-- Description -->
  <text x="96" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#94A3B8">485 flashcards · 201 practice questions · Interactive METAR tools</text>
  <!-- Bottom URL -->
  <text x="96" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#06B6D4">flycensed.com</text>
  <!-- App Store badge area -->
  <rect x="900" y="490" width="220" height="60" rx="12" fill="#06B6D4" />
  <text x="1010" y="528" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Download Free</text>
